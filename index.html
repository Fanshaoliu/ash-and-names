<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172d36"><meta name="description" content="明天照常营业：一个没有战斗的像素探秘故事。在城镇、房间和暗道中找线索，决定谁来安排明天。"><title>明天照常营业 · 像素探秘</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231d3941' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23edd8a3' d='M5 8h22v17H5z'/%3E%3Cpath fill='none' stroke='%2355867f' stroke-width='2' d='m6 9 10 9L26 9'/%3E%3C/svg%3E"><link rel="preload" href="assets/fonts/fusion-pixel-12px-sc.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css"><script src="story.js" defer></script><script src="philosophy.js" defer></script><script src="world.js" defer></script><script src="assets/art-layout.js" defer></script><script src="art.js" defer></script><script src="game.js" defer></script></head><body>
<header class="top"><a class="logo" href="./"><span class="envelope">✉</span><span>明天照常营业<small>TOMORROW, OPEN AS USUAL</small></span></a><div class="top-actions"><button id="sound" aria-label="打开声音">♫ <span>声音关</span></button><button id="full" aria-label="全屏">⛶</button></div></header>
<main>
<section id="titleScreen" aria-label="开始界面"><img class="cover" src="assets/cover-v3.png" alt="暮色里的运河小城、钟楼和亮着灯的早餐铺，三个年轻人站在石阶上"><div class="cover-shade"></div><div class="title-copy"><span class="edition">一封尚未被批准的请假条</span><h1>明天<br><em>照常营业</em><span>TOMORROW, OPEN AS USUAL</span></h1><p>万物都可以凭空制造。<br>唯独明天，不能替你过。</p><div class="title-buttons"><button id="newGame" class="primary" disabled>正在整理街道……</button><button id="continueGame" hidden>继续上次的调查</button></div><p id="loadMessage" class="load-note" role="status">正在装好门、窗和人的脚步。</p><div class="genre">像素探秘<span>·</span>日常悬疑<span>·</span>多重分歧</div></div><div class="title-bottom"><span>本城满意度 100%<small>如有异议，欢迎亲自来看看。</small></span><button id="titleGuide">第一次来？</button></div></section>
<section id="playScreen" hidden>
 <div class="game-heading"><div><span id="caseNumber" class="eyebrow"></span><h2 id="caseTitle"></h2></div><button id="notesTop" class="notebook-button">▤ 便签本</button></div>
 <div class="location-row"><span id="breadcrumbs"></span><span id="saveState" role="status">已保存</span></div>
 <div class="game-shell">
  <div id="stage" class="stage"><canvas id="world" width="384" height="240" tabindex="0" aria-label="探秘地图，方向键移动，E互动，M地图"></canvas><div id="mapName" class="map-name" hidden></div><div id="miniWrap" class="mini-wrap"><canvas id="mini" aria-label="当前区域小地图"></canvas><span id="miniLabel"></span></div><div id="nearHint" class="near-hint" hidden></div><div id="transition" class="transition" hidden></div>
  <section id="dialogue" class="dialogue" aria-label="剧情对话" hidden><div class="dialogue-head"><span id="speaker"></span><span id="lineCount"></span><button id="readSegment" title="读完本段，决定仍需亲自选择">读完本段 »</button></div><div class="dialogue-main"><canvas id="portrait" width="112" height="112" aria-label="说话者头像"></canvas><p id="dialogueText"></p></div><div id="choices" class="choices"></div><button id="nextLine" class="next-line">继续 <span>A ▾</span></button></section>
 </div>
 <div class="goal-bar"><div><small>记着的事</small><p id="goalText"></p></div><button id="hintBtn">指一下路</button></div>
 <div class="touchbar"><div class="dpad" aria-label="方向控制"><button data-dir="up" aria-label="向上走">▲</button><button data-dir="left" aria-label="向左走">◀</button><span>✥</span><button data-dir="right" aria-label="向右走">▶</button><button data-dir="down" aria-label="向下走">▼</button></div><p>点地面行走<br>点门进入 · 点人物交谈</p><button id="actionBtn" class="action-button" aria-label="互动">A<small>交谈 / 查看</small></button></div>
 <div class="case-strip"><span>本案线索</span><div id="clueStrip"></div><span class="desktop-hint">方向键 / WASD 行走 · E 互动</span></div>
 </div>
 <nav class="bottom-nav" aria-label="游戏菜单"><button id="mapBtn">◈ 地图 <kbd>M</kbd></button><button id="notesBtn">▤ 便签 <kbd>J</kbd></button><button id="branchesBtn">⑂ 分歧 <kbd>Y</kbd></button><button id="saveBtn">▣ 存档</button><button id="helpBtn">? 怎么玩</button></nav>
</section>
</main>
<footer><span>有些问题，适合留到下一碗面。</span><div><button id="titleSave">存档</button><a href="script.html" target="_blank" rel="noopener">完整剧本 · 含剧透 ↗</a></div></footer>
<div id="modalShade" class="modal-shade" hidden><section id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><small>一本便签本，装不下标准答案</small><h2 id="modalTitle"></h2></div><button id="closeModal" aria-label="关闭面板">×</button></div><nav id="tabs" class="tabs"></nav><div id="modalBody" class="modal-body"></div></section></div><div id="toast" class="toast" role="status" hidden></div><input type="file" id="importFile" accept=".json,application/json" hidden>
</body></html>
